exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY DBUS_SESSION_BUS_ADDRESS
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY DBUS_SESSION_BUS_ADDRESS
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec fcitx5 -d
exec elephant
exec walker --gapplication-service
exec waypaper_rs --restore
exec autotiling
exec waybar --config $HOME/.config/waybar/config.jsonc --style $HOME/.config/waybar/style.css
exec flameshot
exec swaync
exec foot --server
exec blueman-applet
exec while inotifywait -qq -e close_write -r ~/.config/sway/; do swaymsg reload; done
