position = "Top"
layer = "Top"
language = "pt-BR"
region = "pt-BR"

[modules]
left = ["Workspaces"]
center = ["WindowTitle"]
right = ["Tray", ["Brightness", "Settings"], "Tempo"]

[workspaces]
enable_workspace_filling = true
max_workspaces = 5

[window_title]
mode = "Title"

[tempo]
clock_format = " %A %d %H:%M"
weather_location = "Current"
weather_indicator = "IconAndTemperature"

[settings]
lock_cmd = "hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

audio_indicator_format = "IconAndPercentage"
microphone_indicator_format = "Icon"
network_indicator_format = "IconAndName"
volume_step = 5

indicators = ["Audio", "Microphone", "Network", "Bluetooth", "Battery"]

[[CustomModule]]
name = "Brightness"
type = "Button"
icon = "󰃟"
command = "~/.local/scripts/ashell-brightness.sh set"
on_scroll_up = "~/.local/scripts/ashell-brightness.sh up"
on_scroll_down = "~/.local/scripts/ashell-brightness.sh down"
listen_cmd = "~/.local/scripts/ashell-brightness.sh listen"

[appearance]
font_name = "CaskaydiaCove Nerd Font"
text_color = "#cdd6f4"                               # text
success_color = "#a6e3a1"                            # green (pulseaudio)
warning_color = "#f9e2af"                            # yellow (weather)
danger_color = "#f38ba8"                             # red (urgent/alerts)
workspace_colors = ["#cba6f7", "#89b4fa", "#a6e3a1"]

[appearance.primary_color]
base = "#cba6f7"
text = "#11111b"

[appearance.background_color]
base = "#181825"
weak = "#313244"
strong = "#45475a"

[appearance.bar]
surface = "solid"
